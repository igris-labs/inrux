[workspace]
members = ["packages/*", "playground/*"]
exclude = ["vendor/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
inrux-text = { path = "packages/inrux-text" }
inrux-markdown = { path = "packages/inrux-markdown" }
inrux-gpui = { path = "packages/inrux-gpui" }
inrux-adapter = { path = "packages/inrux-adapter", default-features = false }
inrux-masonry = { path = "packages/inrux-masonry" }
inrux-core = { path = "packages/inrux-core" }
inrux-style = { path = "packages/inrux-style" }
inrux-compiler = { path = "packages/inrux-compiler" }
inrux-components = { path = "packages/inrux-components" }
inrux-egui = { path = "packages/inrux-egui" }
inrux = { path = "packages/inrux" }
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "accesskit"] }
taffy = "0.9"
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"

# Published upstream versions still trigger future-incompatibility lints.
# Keep these source fixes local and reviewable until fixed releases are available.
[patch.crates-io]
block = { path = "vendor/block-0.1.6" }
proc-macro-error2 = { path = "vendor/proc-macro-error2-2.0.1" }
