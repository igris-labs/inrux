[package]
name = "inrux-masonry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT AND Apache-2.0"
publish.workspace = true

[dependencies]
# Use the shared text provider version, not Masonry's older public re-export.
parley.workspace = true
inrux-text.workspace = true
inrux-adapter = { workspace = true, features = ["taffy-layout"] }
inrux-components.workspace = true
inrux-core.workspace = true
inrux-style.workspace = true
tracing = { version = "0.1", default-features = false, features = ["std"] }
masonry = "=0.4.0"
masonry_winit = "=0.4.0"
# Match Vello/wgpu's Naga major: codespan feature unification requires termcolor.
naga = { version = "26", default-features = false, features = ["termcolor"] }

[build-dependencies]
# Shader compilation uses Cargo's separate host feature graph.
naga = { version = "26", default-features = false, features = ["termcolor"] }

[dev-dependencies]
masonry = { version = "=0.4.0", features = ["testing"] }

[lints]
workspace = true
