<text x="72" y="1561" class="section">FALLBACK PROVIDERS · used only by adapters that need them</text>
<text x="72" y="1595" class="body">Existing library or focused Inrux implementation; private when used once, reusable when genuinely shared.</text>
<text x="72" y="1621" class="small">Compile only required providers. Never silently change semantics; diagnose unsupported behavior.</text>
<rect x="48" y="1661" width="1704" height="142" rx="12" fill="#f4f7fa" stroke="#c4d0dc" stroke-width="2"/>
<text x="72" y="1699" class="section">THREAD &amp; EXECUTION OWNERSHIP</text>
<text x="72" y="1735" class="body">UI thread: native trees / layout / text / paint / input   ↔   Coordinator: application state and view construction</text>
<text x="72" y="1770" class="body">Bounded workers: owned background work → typed completion → coordinator; cancellation follows instance lifetime.</text>
<text x="48" y="1841" class="tag">VALIDATION: contract conformance → native interaction tests → comparable release benchmarks → default-engine decision</text>
<text x="48" y="1875" class="small">Current: replaceable layout/text contracts; Taffy layout + native text. Native layout substitutions remain planned.</text>
<text x="48" y="1906" class="small">Only the selected engine is compiled. No live switching. Native delegation does not imply a measured speed advantage.</text>
